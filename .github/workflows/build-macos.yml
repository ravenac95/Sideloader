name: macOS builds

# Temporary (scratch branch): do the cross-compiled macOS CLI binaries from
# "CLI builds" run 44057405566 actually start on macOS?
on:
  push:
    branches: ['ci-debug-macos']

permissions:
  contents: read
  actions: read

jobs:
  run-cross-built:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       artifact: sideloader-cli-arm64-apple-macos }
          - { runner: macos-15-intel, artifact: sideloader-cli-x86_64-apple-darwin }
    name: ${{ matrix.artifact }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: 44057405566
          github-token: ${{ github.token }}
          path: bin
      - run: brew install libimobiledevice libplist openssl@3
      - run: ls -la bin; file bin/*
      - name: Run --help
        run: |
          f=$(ls bin/sideloader-* | grep -v '\.dbg$' | head -1); chmod +x "$f"
          set +e; "$f" --help; code=$?; echo "exit code: $code"
          [ $code -eq 0 ]
