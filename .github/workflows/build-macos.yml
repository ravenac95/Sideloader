name: macOS builds

on:
  push:
    branches: ['ci-debug-macos']

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       compiler: ldc-1.40.1, dflags: '' }
          - { runner: macos-15,       compiler: ldc-1.41.0, dflags: '' }
          - { runner: macos-15,       compiler: ldc-latest, dflags: '' }
          - { runner: macos-15-intel, compiler: ldc-1.41.0, dflags: '' }
          - { runner: macos-15-intel, compiler: ldc-latest, dflags: '' }
    name: ${{ matrix.runner }} ${{ matrix.compiler }} ${{ matrix.dflags }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - run: brew install libimobiledevice libplist openssl@3
      - run: ldc2 --version > ver.txt; head -1 ver.txt
      - name: Build
        run: |
          if [ "${{ matrix.dflags }}" = target12 ]; then export MACOSX_DEPLOYMENT_TARGET=12.0; fi
          dub build -b release-debug --compiler=ldc2 :cli-frontend 2>&1 | grep -vE 'Deprecation|which calls|^\s+/' | tail -15
      - name: Backtrace
        continue-on-error: true
        run: DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib" lldb --batch -o run -k "bt 30" -k quit -- ./bin/sideloader --help 2>&1 | grep -vE '^\s+0x' | head -60
      - name: Run
        run: DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib" ./bin/sideloader --help
