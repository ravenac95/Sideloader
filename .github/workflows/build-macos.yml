name: macOS builds

# Native macOS builds of the CLI, on GitHub's own macOS runners (no cross-compilation,
# no third-party SDK download), packaged with every library they load so they run
# without Homebrew. Pushing a tag starting with "v" also publishes the packages and
# their SHA-256 checksums as a GitHub release.

on:
  # Pushes to other branches are covered by pull_request, so each PR push runs once
  # (each run also provisions an anisette machine with Apple).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64

    name: Build CLI for macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # LDC 1.38 and older build binaries that crash at startup on current macOS
      # (druntime getTLSRange); 1.42 and newer cannot compile memutils/Botan yet.
      - name: Set-up D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      # Build-time only: these are copied into the package, which must not need Homebrew.
      - name: Install libraries to bundle
        run: |
          brew install libimobiledevice libplist openssl@3
          brew list --versions libimobiledevice libimobiledevice-glue libusbmuxd libtatsu libplist openssl@3 openssl@4 || true

      - name: Write version file
        uses: ./.github/actions/write-version-file
        with:
          version-text: 'Sideloader macOS build, ${{ github.ref_name }}, commit ${{ github.sha }}'

      - name: Build
        run: dub build -b release-debug --compiler=ldc2 :cli-frontend

      - name: Check architecture
        run: |
          file bin/sideloader
          lipo -archs bin/sideloader | grep -qw "${{ matrix.arch }}"

      # sideloader + lib/ with every library it loads (Sideloader looks in
      # @executable_path/lib first), so it runs on a Mac without Homebrew.
      - name: Package
        run: |
          pkg="sideloader-macos-${{ matrix.arch }}"
          mkdir -p "dist/$pkg/lib"
          cp bin/sideloader "dist/$pkg/"
          python3 .github/scripts/bundle-macos-libs.py "dist/$pkg/lib" "$(brew --prefix)" \
            libimobiledevice-1.0.6.dylib libusbmuxd-2.0.7.dylib 'libplist-2.0.[0-9]*.dylib' \
            libssl.3.dylib libcrypto.3.dylib
          codesign --force --sign - "dist/$pkg/sideloader"
          ls -la "dist/$pkg" "dist/$pkg/lib"
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          (cd dist && shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          cat "dist/$pkg.tar.gz.sha256"

      # Everything below runs the package exactly as a user would: unpacked into a
      # fresh folder, with the Homebrew copies of its libraries uninstalled.
      - name: Remove Homebrew's copies of the bundled libraries
        run: |
          brew uninstall --ignore-dependencies libimobiledevice libimobiledevice-glue libusbmuxd libtatsu libplist openssl@3 openssl@4 || true
          if ls "$(brew --prefix)"/lib | grep -E '^lib(imobiledevice|usbmuxd|plist|tatsu)|^lib(ssl|crypto)\.[34]'; then
            echo "Homebrew copies are still installed"; exit 1
          fi
          echo "No Homebrew copies left."
          mkdir -p "$RUNNER_TEMP/user" && tar -xzf "dist/sideloader-macos-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/user"

      - name: Smoke test
        run: |
          cd "$RUNNER_TEMP/user/sideloader-macos-${{ matrix.arch }}"
          ./sideloader --help

      # Loads libimobiledevice (and through it libusbmuxd, libplist and OpenSSL):
      # with no iPhone attached it must get as far as "Please connect a device."
      - name: libimobiledevice check (no device)
        run: |
          cd "$RUNNER_TEMP/user/sideloader-macos-${{ matrix.arch }}"
          set +e; ./sideloader tool list > tool.log 2>&1; set -e
          sed 's/\x1b\[[0-9;]*m//g' tool.log
          grep -q 'Please connect a device.' tool.log
          ! grep -q 'LibraryLoadingException' tool.log

      # Anonymous flow, no Apple ID: downloads Apple's libraries and provisions the
      # machine with Apple over verified TLS, then stops at "not logged in".
      - name: Verified TLS check (no Apple ID)
        run: |
          cd "$RUNNER_TEMP/user/sideloader-macos-${{ matrix.arch }}"
          export SIDELOADER_CONFIG_DIR="$RUNNER_TEMP/sideloader-config"
          set +e
          ./sideloader app-id list --debug > raw.log 2>&1
          echo "sideloader exit code: $?"
          set -e
          tr '\r' '\n' < raw.log | grep -v '% completed' | sed 's/\x1b\[[0-9;]*m//g' > tls-check.log
          grep -E 'OpenSSL library|server.tls|provision(ed|ing)|logged in|rror' tls-check.log | grep -v 'CALL //' | head -40
          echo "--- last lines ---"; grep -v 'CALL //' tls-check.log | tail -15
          grep -q 'Using OpenSSL library: @executable_path/lib/libssl.3.dylib' tls-check.log
          grep -q 'Verified TLS connection to apps.mzstatic.com' tls-check.log
          grep -q 'Verified TLS connection to gsa.apple.com' tls-check.log
          grep -q 'Device provisioned successfully' tls-check.log

      # Without the bundled OpenSSL, the TLS code must fall back to the LibreSSL that
      # macOS ships.
      - name: Verified TLS check with macOS's LibreSSL
        run: |
          cp -R "$RUNNER_TEMP/user/sideloader-macos-${{ matrix.arch }}" "$RUNNER_TEMP/libressl"
          cd "$RUNNER_TEMP/libressl"
          rm lib/libssl.3.dylib lib/libcrypto.3.dylib
          export SIDELOADER_CONFIG_DIR="$RUNNER_TEMP/sideloader-config-libressl"
          set +e
          ./sideloader app-id list --debug > raw-libressl.log 2>&1
          echo "sideloader exit code: $?"
          set -e
          tr '\r' '\n' < raw-libressl.log | grep -v '% completed' | sed 's/\x1b\[[0-9;]*m//g' > libressl.log
          grep -E 'OpenSSL library|server.tls|provision(ed|ing)|logged in|rror' libressl.log | grep -v 'CALL //' | head -20
          grep -E 'Using OpenSSL library: libssl\.4[0-9]\.dylib' libressl.log
          grep -q 'Verified TLS connection to apps.mzstatic.com' libressl.log
          grep -q 'Verified TLS connection to gsa.apple.com' libressl.log
          grep -q 'Device provisioned successfully' libressl.log

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Built by GitHub Actions from commit ${{ github.sha }}."
          gh release upload "${{ github.ref_name }}" -R "${{ github.repository }}" --clobber dist/*
