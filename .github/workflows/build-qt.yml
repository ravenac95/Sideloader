name: Qt builds

on: [push, workflow_dispatch]

env:
  BUILD_TYPE: Release

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.33.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libz-dev elfutils qtbase5-dev

      - name: Write version file
        run: echo 'module version_string; enum versionStr = "Sideloader automated build, branch ${{ github.ref_name }}, commit ${{ github.sha }}";' > source/version_string.d

      - name: Build
        run: dub build -b release-debug --compiler=ldc2 :qt-frontend

      - name: Rename
        run: mv "${{github.workspace}}/bin/sideloader" "${{github.workspace}}/bin/sideloader-qt-linux-x86_64"

      - name: Put debug symbols in a separate file
        run: eu-strip --strip-debug -f "${{github.workspace}}/bin/sideloader-qt-linux-x86_64.dbg" "${{github.workspace}}/bin/sideloader-qt-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-qt-linux-x86_64
          path: |
            ${{github.workspace}}/bin/sideloader-qt-linux-x86_64
            ${{github.workspace}}/bin/sideloader-qt-linux-x86_64.dbg

  # Native macOS builds with Homebrew's Qt 5 (qt@5), on GitHub's own runners.
  # (The previous jobs cross-compiled from Ubuntu with Homebrew's Monterey llvm
  # bottle, which no longer exists, and linked the arm64 build against x86_64 Qt.)
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64

    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # LDC 1.38 and older build binaries that crash at startup on current macOS
      # (druntime getTLSRange); 1.42 and newer cannot compile memutils/Botan yet.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Install Qt 5 and runtime libraries
        run: |
          brew install qt@5 libimobiledevice libplist openssl@3
          echo "QT5_PREFIX=$(brew --prefix qt@5)" >> "$GITHUB_ENV"

      - name: Write version file
        run: echo 'module version_string; enum versionStr = "Sideloader automated build, branch ${{ github.ref_name }}, commit ${{ github.sha }}";' > source/version_string.d

      - name: Build
        run: dub build -b release-debug --compiler=ldc2 :qt-frontend

      - name: Check architecture
        run: |
          file bin/sideloader
          lipo -archs bin/sideloader | grep -qw "${{ matrix.arch }}"

      - name: Build bundle
        run: |
          app=frontends/common/resources/macos/Sideloader.app
          cp bin/sideloader "$app/Contents/MacOS/"
          # Copies the Qt frameworks and plugins into the bundle and rewrites their paths.
          "$QT5_PREFIX/bin/macdeployqt" "$app" -always-overwrite
          otool -L "$app/Contents/MacOS/sideloader" | grep -i qt
          tar -czpf Sideloader-qt.app.tgz -C frontends/common/resources/macos/ Sideloader.app

      # The bundle must start on its own (no Homebrew Qt paths). GitHub's macOS
      # runners have a window server, so run it normally for a few seconds and
      # fail if it exits early (a crash or a missing library).
      - name: Smoke test the bundle
        run: |
          app=frontends/common/resources/macos/Sideloader.app
          export SIDELOADER_CONFIG_DIR="$RUNNER_TEMP/sideloader-config"
          "$app/Contents/MacOS/sideloader" > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 $pid 2>/dev/null; then
            echo "Still running after 10s: OK"; kill $pid
            head -40 smoke.log
          else
            code=0; wait $pid || code=$?
            echo "Exited early with code $code"; cat smoke.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-qt-macOS-${{ matrix.arch }}
          path: |
            ${{github.workspace}}/Sideloader-qt.app.tgz

  build-windows-x86_64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.34.0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.1.*'
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          dir: '${{github.workspace}}/qt/'
          arch: 'win64_msvc2019_64'
          archives: 'qtbase'

      - name: Write version file
        run: echo 'module version_string; enum versionStr = "Sideloader automated build, branch ${{ github.ref_name }}, commit ${{ github.sha }}";' > source/version_string.d

      - name: Build
        run: |
          $env:LIB += ';' + $env:Qt5_Dir + '\lib'
          echo $env:LIB
          dub build -b release-debug --compiler=ldc2 :qt-frontend

      - name: Rename
        run: |
          mkdir "${{github.workspace}}/bin/platforms"
          Copy-Item ($env:Qt5_DIR + '/plugins/platforms/qwindows.dll') "${{github.workspace}}/bin/platforms"
          mkdir "${{github.workspace}}/bin/styles"
          Copy-Item ($env:Qt5_DIR + '/plugins/styles/qwindowsvistastyle.dll') "${{github.workspace}}/bin/styles"
          Copy-Item ($env:Qt5_DIR + '/bin/Qt5Core.dll'),($env:Qt5_DIR + '/bin/Qt5Gui.dll'),($env:Qt5_DIR + '/bin/Qt5Widgets.dll') "${{github.workspace}}/bin"
          Compress-Archive -Path bin/* -DestinationPath sideloader-qt-windows.zip 

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-qt-windows-x86_64
          path: |
            ${{github.workspace}}/sideloader-qt-windows.zip
